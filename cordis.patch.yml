# dsh-dashboard bundle patch：把会话控制台插件挂进 DSH 配置树。
#
# - insert：往配置树添加新插件行；id 全局唯一且与包名一致（商城预检按它抓 entry ID）。
# - name: 'dsh-dashboard' 解析包入口 lib/index.js（宿主半侧）；
#   package.json 声明了 dsh.client，DSH 模块系统同时按 exports["./client"] 提供浏览器半侧。
# - v3 起无代理耦合：数据面 = DSH 宿主（sessionQuery / tools.restrict / compaction），
#   行配置无需 adminBase；enabled 仅为兼容旧配置，实际总开关以 ~/.dsh/dsh-dashboard/master.json 为准。
- insert:
    - id: dsh-dashboard
      name: 'dsh-dashboard'
      config:
        enabled: true
        poolUrl: 'http://127.0.0.1:7862'

# 启用压缩服务（web 组合默认禁用）：控制台「清空上下文」依赖 compaction；
# 注意：启用后 agent 压力/溢出自动压缩全局生效（用户已确认）。
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: false
  config: {}
