<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:" />
<title>会话控制台</title>
<style>
  /* ===== 基础：透明窗口 + 深色圆角卡片 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8eaed;
    font-size: 13px;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 深色圆角卡片：外边距 12px，撑满剩余空间 */
  #card {
    position: absolute;
    inset: 12px;
    display: flex;
    flex-direction: column;
    background: rgba(24, 26, 30, 0.94);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }

  /* ===== 顶栏（可拖动） ===== */
  #topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 10px 0 14px;
    -webkit-app-region: drag;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
  }
  #topbar .title { font-weight: 600; font-size: 14px; flex: 1; }
  .no-drag { -webkit-app-region: no-drag; }
  .icon-btn {
    width: 26px; height: 26px; border: none; border-radius: 8px;
    background: transparent; color: #cfd4dc; font-size: 14px; cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.10); }
  /* 状态点：绿=数据源可达，红=数据源不可达，灰=检测中 */
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.green { background: #34c759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.8); }
  .dot.red   { background: #ff5f57; box-shadow: 0 0 6px rgba(255, 95, 87, 0.8); }
  .dot.gray  { background: #8a8f98; }

  /* ===== 顶部提示条 ===== */
  #banner {
    flex-shrink: 0;
    padding: 6px 12px;
    font-size: 12px;
    color: #ffd7d7;
    background: rgba(200, 60, 60, 0.25);
    border-bottom: 1px solid rgba(255, 95, 87, 0.35);
  }
  .hidden { display: none !important; }

  /* ===== 中间区：常驻面板 + 内部滚动列表 + 底部常驻详情 ===== */
  #middle { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* 折叠条 */
  .collapse-head {
    width: 100%;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: none; color: #cfd4dc;
    padding: 9px 12px; font-size: 13px; cursor: pointer; text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
  }
  .collapse-head:hover { background: rgba(255, 255, 255, 0.08); }
  .collapse-head .chev { display: inline-block; transition: transform .15s; }
  .collapse-head.open .chev { transform: rotate(90deg); }
  .collapse-body {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
  }

  /* 行标签 */
  .row-label { font-size: 12px; color: #9aa0a8; margin: 10px 0 4px; }
  .row-label:first-child { margin-top: 0; }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip {
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 999px;
    background: transparent; color: #c8cdd5;
    padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .chip.on { background: rgba(110, 139, 255, 0.30); border-color: #6e8bff; color: #fff; }
  .chip:disabled { opacity: 0.55; cursor: default; }

  /* 小按钮（如「恢复全部」） */
  .mini-btn {
    margin-top: 8px;
    border: 1px solid rgba(255, 255, 255, 0.20); border-radius: 8px;
    background: rgba(255, 255, 255, 0.06); color: #cfd4dc;
    padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .mini-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .mini-btn:disabled { opacity: 0.45; cursor: default; }

  /* ===== token 预算：slider + 预设 chips + 右侧数值文本 ===== */
  .budget-line { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .budget-line .row-label { flex: 1; margin: 0; }
  .budget-val {
    font-size: 12px; color: #b6bcc6; white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .range {
    -webkit-appearance: none; appearance: none;
    display: block; width: 100%; height: 4px; margin: 8px 0 6px;
    border-radius: 2px; background: rgba(255, 255, 255, 0.16);
    outline: none; cursor: pointer;
  }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #6e8bff; border: none;
    box-shadow: 0 0 0 3px rgba(110, 139, 255, 0.25);
  }
  .range::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #6e8bff; border: none;
  }
  .range:focus-visible { outline: 2px solid rgba(110, 139, 255, 0.7); outline-offset: 2px; }
  .range:disabled { opacity: 0.45; cursor: default; }
  #defaults { flex-shrink: 0; }
  #budget-block { margin-bottom: 8px; }

  /* ===== 常驻选中区（列表上方；无选中时占位） ===== */
  #selected-resident {
    flex-shrink: 0;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    background: rgba(0, 0, 0, 0.15);
  }
  #selected-resident .d-head {
    font-size: 13px; font-weight: 600; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .d-sub { font-size: 11px; color: #8a9099; }

  /* ===== 会话列表（内部滚动） ===== */
  #session-list { flex: 1; min-height: 0; overflow-y: auto; }
  .session-row {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding: 9px 12px; cursor: pointer; color: inherit;
  }
  .session-row:hover { background: rgba(255, 255, 255, 0.05); }
  .session-row.selected {
    background: rgba(110, 139, 255, 0.16);
    border-left: 3px solid #6e8bff;
  }
  .s-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-sub { font-size: 11px; color: #8a9099; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 18px 12px; color: #7d838c; text-align: center; }

  /* ===== 选中会话详情（底部常驻区） ===== */
  #detail {
    flex-shrink: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.18);
  }
  #detail .collapse-head { padding: 7px 4px; }
  #detail .collapse-body { padding: 8px 4px; }
  .danger {
    width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; cursor: pointer;
    background: rgba(255, 82, 82, 0.16); color: #ff8585;
    border: 1px solid rgba(255, 82, 82, 0.45); font-size: 13px;
  }
  .danger:hover { background: rgba(255, 82, 82, 0.26); }
  .danger:disabled { opacity: 0.55; cursor: default; }

  /* ===== 页脚 ===== */
  #footer {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; font-size: 11px; color: #8a9099;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  #footer .grow { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== 说明弹窗 ===== */
  #modal-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #modal {
    width: 84%; background: #23262c; border-radius: 14px; padding: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  #modal h3 { font-size: 14px; margin-bottom: 8px; }
  #modal p { font-size: 12.5px; line-height: 1.7; color: #c8cdd5; -webkit-user-select: text; user-select: text; }
  #modal button {
    margin-top: 12px; width: 100%; padding: 7px; border-radius: 8px; border: none;
    background: #6e8bff; color: #fff; font-size: 13px; cursor: pointer;
  }

  /* ===== 提示条（默认错误红；.ok 成功绿） ===== */
  #toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    background: rgba(200, 60, 60, 0.92); color: #fff; font-size: 12px;
    padding: 6px 12px; border-radius: 8px; z-index: 20; max-width: 90%;
  }
  #toast.ok { background: rgba(52, 199, 89, 0.95); }
</style>
</head>
<body>
  <div id="card">
    <!-- 顶栏：拖动区域 + 状态点 + ⚙ + ✕ -->
    <header id="topbar">
      <span class="title">会话控制台</span>
      <span id="dot" class="dot gray" title="检测中"></span>
      <button id="btn-help" class="icon-btn no-drag" aria-label="说明">⚙</button>
      <button id="btn-close" class="icon-btn no-drag" aria-label="关闭窗口">✕</button>
    </header>

    <!-- 数据源不可达提示条 -->
    <div id="banner" class="hidden">数据源不可达，重试中</div>

    <main id="middle">
      <!-- 常驻选中区：选中会话标题 + 状态小字（无选中时占位） -->
      <section id="selected-resident">
        <div class="d-head" id="b-head-title">未选中会话</div>
        <div class="d-sub" id="b-head-status"></div>
      </section>

      <!-- 默认模式折叠区（默认折叠）：默认 token 预算 + 默认工具白名单 -->
      <section id="defaults">
        <button id="btn-defaults" class="collapse-head" aria-expanded="false">
          <span class="chev">▸</span> 默认模式
        </button>
        <div id="body-defaults" class="collapse-body hidden">
          <!-- ① 默认 token 预算（null=不限制）：拖动仅更新文本，松开才保存 -->
          <div class="budget-line">
            <label class="row-label" for="def-budget-range">默认预算（null=不限制）</label>
            <span class="budget-val" id="def-budget-val">不限制</span>
          </div>
          <input type="range" id="def-budget-range" class="range" min="1024" max="32768" step="1024" value="8192" />
          <div class="chips">
            <button type="button" class="chip preset" data-v="8192" aria-label="默认预算 8K">8K</button>
            <button type="button" class="chip preset" data-v="20480" aria-label="默认预算 20K">20K</button>
            <button type="button" class="chip preset" data-v="32768" aria-label="默认预算 32K">32K</button>
            <button type="button" class="chip" id="btn-def-unlimit" aria-label="默认预算不限制">不限制</button>
          </div>
          <!-- ② 默认工具白名单（null=不限制；全不选 → null 恢复全部） -->
          <div class="row-label" id="def-tools-note">全部允许（不限制）</div>
          <div class="chips" id="def-tools"></div>
        </div>
      </section>

      <!-- 会话列表（内部滚动） -->
      <section id="session-list"></section>

      <!-- 选中会话：token 预算 + 工具白名单 + 清空上下文（底部常驻区） -->
      <section id="detail" class="hidden">
        <!-- token 预算块（位于白名单折叠条之前） -->
        <section id="budget-block">
          <div class="budget-line">
            <label class="row-label" for="s-budget-range">token 预算</label>
            <span class="budget-val" id="s-budget-usage">未挂载（需打开会话）</span>
          </div>
          <input type="range" id="s-budget-range" class="range" min="1024" max="32768" step="1024" value="8192" />
          <div class="chips">
            <button type="button" class="chip preset" data-v="8192" aria-label="会话预算 8K">8K</button>
            <button type="button" class="chip preset" data-v="20480" aria-label="会话预算 20K">20K</button>
            <button type="button" class="chip preset" data-v="32768" aria-label="会话预算 32K">32K</button>
            <button type="button" class="chip" id="btn-s-unlimit" aria-label="会话预算不限制">不限制</button>
          </div>
        </section>
        <section>
          <button id="btn-tools" class="collapse-head" aria-expanded="false">
            <span class="chev">▸</span> 工具白名单
          </button>
          <div id="body-tools" class="collapse-body hidden">
            <div class="row-label" id="s-tools-note"></div>
            <div class="chips" id="s-tools"></div>
            <button id="btn-allow-all" class="mini-btn" aria-label="恢复全部">恢复全部</button>
          </div>
        </section>
        <button id="btn-clear" class="danger" aria-label="清空上下文">清空上下文</button>
      </section>
    </main>

    <!-- 页脚：数据源 + 轮询频率 + 最近更新时间 -->
    <footer id="footer">
      <span class="grow" id="data-source" title="数据源">-</span>
      <span>5s 轮询</span>
      <span id="last-update">最近更新 -</span>
    </footer>
  </div>

  <!-- 说明弹窗（ESC 或点遮罩关闭） -->
  <div id="modal-mask" class="hidden" role="dialog" aria-modal="true" aria-label="使用说明">
    <div id="modal">
      <h3>说明</h3>
      <p>✕ 仅关闭窗口，进程保留，可点 DSH 内齿轮弹窗的“打开外窗”快速复现；完全关闭请在齿轮弹窗选“关闭控制台”或设置页关闭总开关。数据源为 DSH 会话；工具白名单与清空上下文对 DSH 会话生效。</p>
      <button id="btn-modal-close">知道了</button>
    </div>
  </div>

  <!-- 提示条 -->
  <div id="toast" class="hidden" role="status"></div>

<script>
'use strict';

/* ================= 本地状态 ================= */

var sessions = [];        // 会话列表（来自 GET /api/sessions，按接口返回顺序渲染）
var toolsCatalog = [];    // 全局工具目录（来自 GET /api/tools，宿主已排序）
var selectedId = null;    // 当前选中会话 id
var polling = false;      // 轮询防重入
var savingTools = false;  // 工具白名单保存中（阻止并发点击）
var clearTimer = null;    // “清空上下文”确认复位定时器
var toastTimer = null;    // 提示条自动隐藏定时器
var defaults = { allow: null, budget: null }; // 默认模式：工具白名单 / token 预算（来自 /api/sessions）
var usage = { sessionId: null, tokens: null }; // 选中会话用量缓存（GET /api/usage）
var usageFetching = null;   // 正在拉取用量的会话 id（防重入）
var savingBudget = false;   // 会话预算保存中（阻止并发点击）
var savingDefaults = false; // 默认模式（预算/白名单）保存中
var dragBudget = null;      // 会话预算拖动中的临时展示值（未提交）

function $(id) { return document.getElementById(id); }

/* ================= 基础工具 ================= */

// 提示条（3s 自动隐藏；isOk=true 用成功绿样式）
function showToast(msg, isOk) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.toggle('ok', !!isOk);
  t.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 3000);
}

/* ================= 网络请求（全部同源相对路径） ================= */

function apiGet(p) {
  return fetch(p, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

// POST 返回解析后的 JSON（无论 HTTP 状态都尝试解析，业务态看 data.ok）
function apiPost(p, body) {
  return fetch(p, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { throw new Error('HTTP ' + r.status); });
  });
}

/* ================= 在线状态 ================= */

// 绿=数据源可达；红=数据源不可达（顶部同时出现提示条）
function setOnline(ok) {
  $('dot').className = 'dot ' + (ok ? 'green' : 'red');
  $('dot').title = ok ? '数据源可达' : '数据源不可达';
  $('banner').classList.toggle('hidden', ok);
}

/* ================= 轮询（5s，两个接口并发、防重入） ================= */

function pollAll() {
  if (polling) return; // 上一次未结束则跳过本轮
  polling = true;
  var listEl = $('session-list');
  var scrollTop = listEl.scrollTop; // 渲染后恢复列表内部滚动位置

  Promise.allSettled([apiGet('/api/sessions'), apiGet('/api/tools')]).then(function (results) {
    var sr = results[0]; // sessions
    var tr = results[1]; // tools 目录（变化少但一并刷新）
    // 任一失败 → 状态点变红 + 顶部提示条；全部成功 → 恢复绿
    setOnline(sr.status === 'fulfilled' && tr.status === 'fulfilled');

    if (sr.status === 'fulfilled') {
      var data = sr.value || {};
      sessions = Array.isArray(data.sessions) ? data.sessions : [];
      defaults.allow = data.defaultAllow === undefined ? null : data.defaultAllow;
      defaults.budget = data.defaultBudget === undefined ? null : data.defaultBudget;
      // 选中会话已被清除则取消选中
      if (selectedId && !sessions.some(function (s) { return s.id === selectedId; })) selectedId = null;
      renderSessions();
      renderDetail();
      renderDefaults();
    }
    if (tr.status === 'fulfilled') {
      var t = tr.value || {};
      toolsCatalog = Array.isArray(t.tools) ? t.tools.slice() : toolsCatalog;
      renderDetail(); // 目录变化后刷新选中会话的 chips
      renderDefaults(); // 目录变化后刷新默认白名单 chips
    }
    refreshUsage(); // 每轮轮询刷新选中会话用量（失败静默保留旧文本）

    $('last-update').textContent = '最近更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    listEl.scrollTop = scrollTop;
    polling = false;
  });
}

/* ================= 会话列表渲染 ================= */

function renderSessions() {
  var list = $('session-list');
  list.innerHTML = '';
  if (!sessions.length) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无会话';
    list.appendChild(empty);
    return;
  }
  sessions.forEach(function (s) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'session-row' + (s.id === selectedId ? ' selected' : '');
    row.setAttribute('aria-label', '选择会话 ' + (s.id || ''));
    row.setAttribute('aria-pressed', s.id === selectedId ? 'true' : 'false');

    var title = document.createElement('div');
    title.className = 's-title';
    title.textContent = s.title || s.id || '(无标题)'; // 标题为空时显示 id

    var sub = document.createElement('div');
    sub.className = 's-sub';
    sub.textContent = (s.id || '') + ' · ' + (s.live ? '活动' : '冷'); // 活动/冷 标记

    row.appendChild(title);
    row.appendChild(sub);
    row.addEventListener('click', function () {
      selectedId = s.id; // 单击选中高亮
      usage = { sessionId: s.id, tokens: null }; // 切换会话：清掉旧会话用量
      renderSessions();
      renderDetail();
      refreshUsage(); // 选中变化立即拉取用量
    });
    list.appendChild(row);
  });
}

/* ================= 选中会话：常驻选中区 + 底部工具/清空 ================= */

// 白名单摘要：allow===null → 全部允许；数组 → 已限制 N 个工具
function allowSummary(allow) {
  if (allow === null || allow === undefined) return '全部允许';
  return '已限制 ' + allow.length + ' 个工具';
}

// 千分位数字格式化：2340 → "2,340"
function fmtNum(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

// 预算展示文本：null → 不限制；1024 的整数倍 → NK；其余按原值
function budgetText(v) {
  if (v === null || v === undefined) return '不限制';
  if (v % 1024 === 0) return (v / 1024) + 'K';
  return fmtNum(v);
}

function renderDetail() {
  var s = sessions.find(function (x) { return x.id === selectedId; });
  if (!s) {
    // 无选中：常驻区占位，详情隐藏
    $('b-head-title').textContent = '未选中会话';
    $('b-head-status').textContent = '';
    $('detail').classList.add('hidden');
    return;
  }
  $('b-head-title').textContent = s.title || s.id || '(无标题)';
  // 状态小字：活动 / 冷（未挂载）+ 白名单摘要
  $('b-head-status').textContent = (s.live ? '活动' : '冷（未挂载）') + ' · ' + allowSummary(s.allow);
  $('detail').classList.remove('hidden');
  renderToolsChips(s);
  syncSessionBudgetUI(); // 预算块：slider 位置 / 预设高亮 / 用量文本
}

// 工具白名单 chips：候选来自 GET /api/tools 的全局目录；
// allow===null 时全部未选中并显示「全部允许（不限制）」标签
function renderToolsChips(s) {
  var allow = s.allow;
  var note = $('s-tools-note');
  if (allow === null || allow === undefined) {
    note.textContent = '全部允许（不限制）';
  } else {
    note.textContent = '已选中 ' + allow.length + ' 个工具';
  }

  var selected = Array.isArray(allow) ? allow.slice() : [];
  var container = $('s-tools');
  container.innerHTML = '';
  toolsCatalog.forEach(function (t) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (selected.indexOf(t) !== -1 ? ' on' : '');
    chip.textContent = t;
    chip.disabled = savingTools; // 保存中锁定，防并发
    chip.setAttribute('aria-label', '切换工具 ' + t);
    chip.setAttribute('aria-pressed', selected.indexOf(t) !== -1 ? 'true' : 'false');
    chip.addEventListener('click', function () {
      var set = selected.slice();
      var i = set.indexOf(t);
      if (i === -1) set.push(t); else set.splice(i, 1);
      saveSessionAllow(s.id, set.length ? set : null); // 全不选 → null（恢复全部）
    });
    container.appendChild(chip);
  });

  // 「恢复全部」：allow 已是 null（全部允许）时禁用
  $('btn-allow-all').disabled = savingTools || allow === null || allow === undefined;
}

// 保存会话工具白名单：POST /api/allow {sessionId, allow:[...]|null}
function saveSessionAllow(sessionId, allow) {
  if (savingTools) return; // 保存中忽略并发点击
  savingTools = true;
  var s = sessions.find(function (x) { return x.id === sessionId; });
  var oldAllow = s ? s.allow : null;
  if (s) s.allow = allow; // 乐观更新展示，失败回滚
  renderDetail();

  apiPost('/api/allow', { sessionId: sessionId, allow: allow }).then(function (data) {
    if (!data || data.ok !== true) throw new Error((data && data.error) || 'HTTP 错误');
    var cur = sessions.find(function (x) { return x.id === sessionId; });
    if (cur) cur.allow = allow; // 成功后固化本地值
    savingTools = false;
    renderDetail();
  }).catch(function () {
    if (s) s.allow = oldAllow; // 失败：按旧值回滚展示
    savingTools = false;
    showToast('工具白名单保存失败，已回滚');
    renderDetail();
  });
}

/* ================= 默认模式：默认预算 + 默认工具白名单 ================= */

// 默认预算控件整体禁用（保存中锁定，防并发）
function setDefControlsDisabled(dis) {
  $('def-budget-range').disabled = dis;
  $('btn-def-unlimit').disabled = dis;
  var presets = document.querySelectorAll('#body-defaults .preset');
  for (var i = 0; i < presets.length; i++) presets[i].disabled = dis;
}

// 默认预算 UI 同步；force=true 时无视焦点强制回写（提交/回滚后使用）
function syncDefaultBudgetUI(force) {
  var b = defaults.budget;
  var range = $('def-budget-range');
  if (force || document.activeElement !== range) {
    // null → slider 停在 8K 占位，右侧文本显示「不限制」
    range.value = (b === null || b === undefined) ? 8192 : b;
    $('def-budget-val').textContent = budgetText(b);
  }
  var presets = document.querySelectorAll('#body-defaults .preset');
  for (var i = 0; i < presets.length; i++) {
    presets[i].classList.toggle('on', presets[i].getAttribute('data-v') === String(b));
  }
}

// 提交默认预算：POST /api/defaults {budget: 整数|null}（只传 budget 键）
function commitDefaultBudget(v) {
  if (savingDefaults) return;
  var old = defaults.budget;
  if (old === v) return; // 值未变则不请求
  defaults.budget = v; // 乐观更新展示，失败回滚
  syncDefaultBudgetUI(true);
  savingDefaults = true;
  setDefControlsDisabled(true);
  apiPost('/api/defaults', { budget: v }).then(function (data) {
    if (!data || data.ok !== true) throw new Error((data && data.error) || 'HTTP 错误');
    if (data.defaults) {
      defaults.allow = data.defaults.allow;
      defaults.budget = data.defaults.budget;
    }
    savingDefaults = false;
    setDefControlsDisabled(false);
    syncDefaultBudgetUI(true);
    renderDefaultTools();
  }).catch(function () {
    defaults.budget = old; // 失败：回滚旧值
    savingDefaults = false;
    setDefControlsDisabled(false);
    showToast('默认预算保存失败，已回滚');
    syncDefaultBudgetUI(true);
    renderDefaultTools();
  });
}

// 保存默认工具白名单：POST /api/defaults {allow:[...]|null}（只传 allow 键）
function saveDefaultAllow(allow) {
  if (savingDefaults) return;
  var oldAllow = defaults.allow;
  defaults.allow = allow; // 乐观更新展示，失败回滚
  savingDefaults = true;
  setDefControlsDisabled(true);
  renderDefaultTools(); // 此时 savingDefaults=true，chips 同步禁用
  apiPost('/api/defaults', { allow: allow }).then(function (data) {
    if (!data || data.ok !== true) throw new Error((data && data.error) || 'HTTP 错误');
    if (data.defaults) {
      defaults.allow = data.defaults.allow;
      defaults.budget = data.defaults.budget;
    }
    savingDefaults = false;
    setDefControlsDisabled(false);
    renderDefaultTools();
    syncDefaultBudgetUI(true);
  }).catch(function () {
    defaults.allow = oldAllow; // 失败：回滚旧值
    savingDefaults = false;
    setDefControlsDisabled(false);
    showToast('默认工具白名单保存失败，已回滚');
    renderDefaultTools();
    syncDefaultBudgetUI(true);
  });
}

// 默认白名单 chips：候选来自 /api/tools 全局目录；
// allow===null 时全部未选中并显示「全部允许（不限制）」
function renderDefaultTools() {
  var allow = defaults.allow;
  var note = $('def-tools-note');
  if (allow === null || allow === undefined) {
    note.textContent = '全部允许（不限制）';
  } else {
    note.textContent = '已选中 ' + allow.length + ' 个工具';
  }
  var selected = Array.isArray(allow) ? allow.slice() : [];
  var container = $('def-tools');
  container.innerHTML = '';
  toolsCatalog.forEach(function (t) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (selected.indexOf(t) !== -1 ? ' on' : '');
    chip.textContent = t;
    chip.disabled = savingDefaults; // 保存中锁定，防并发
    chip.setAttribute('aria-label', '切换默认工具 ' + t);
    chip.setAttribute('aria-pressed', selected.indexOf(t) !== -1 ? 'true' : 'false');
    chip.addEventListener('click', function () {
      var set = selected.slice();
      var i = set.indexOf(t);
      if (i === -1) set.push(t); else set.splice(i, 1);
      saveDefaultAllow(set.length ? set : null); // 全不选 → null（恢复全部）
    });
    container.appendChild(chip);
  });
}

// 默认模式区整体渲染（轮询数据刷新入口）
function renderDefaults() {
  syncDefaultBudgetUI(false);
  renderDefaultTools();
}

/* ================= token 预算（选中会话，位于白名单折叠条之前） ================= */

// 会话预算控件整体禁用（保存中锁定）
function setSBudgetControlsDisabled(dis) {
  $('s-budget-range').disabled = dis;
  $('btn-s-unlimit').disabled = dis;
  var presets = document.querySelectorAll('#budget-block .preset');
  for (var i = 0; i < presets.length; i++) presets[i].disabled = dis;
}

// 会话预算 UI 同步（slider 值 / 预设高亮 / 用量文本）
function syncSessionBudgetUI(force) {
  var s = sessions.find(function (x) { return x.id === selectedId; });
  var b = s ? s.budget : null;
  var range = $('s-budget-range');
  if (force || document.activeElement !== range) {
    // null → slider 停在 8K 占位，用量文本显示「未限制」
    range.value = (b === null || b === undefined) ? 8192 : b;
  }
  var presets = document.querySelectorAll('#budget-block .preset');
  for (var i = 0; i < presets.length; i++) {
    presets[i].classList.toggle('on', presets[i].getAttribute('data-v') === String(b));
  }
  updateUsageText();
}

// 用量文本：live → 当前用量（千分位）+ 预算；非 live → 未挂载（需打开会话）
function updateUsageText() {
  var s = sessions.find(function (x) { return x.id === selectedId; });
  var el = $('s-budget-usage');
  if (!s) { el.textContent = ''; return; }
  if (!s.live) { el.textContent = '未挂载（需打开会话）'; return; }
  var b = dragBudget !== null ? dragBudget : s.budget; // 拖动中临时展示
  var tok = (usage.sessionId === s.id && typeof usage.tokens === 'number')
    ? '~' + fmtNum(usage.tokens) + ' tokens' : '…';
  el.textContent = '当前 ' + tok + ' · 预算 ' + budgetText(b);
}

// 提交会话预算：POST /api/budget {sessionId, budget: 整数|null}
function commitSessionBudget(v) {
  var s = sessions.find(function (x) { return x.id === selectedId; });
  if (!s || savingBudget) return;
  dragBudget = null; // 结束拖动中的临时展示（值未变时也需复位）
  if (s.budget === v) return; // 值未变则不请求
  var old = s.budget;
  s.budget = v; // 乐观更新展示，失败回滚
  syncSessionBudgetUI(true);
  savingBudget = true;
  setSBudgetControlsDisabled(true);
  apiPost('/api/budget', { sessionId: s.id, budget: v }).then(function (data) {
    if (!data || data.ok !== true) throw new Error((data && data.error) || 'HTTP 错误');
    savingBudget = false;
    setSBudgetControlsDisabled(false);
    syncSessionBudgetUI(true);
  }).catch(function () {
    s.budget = old; // 失败：回滚旧值
    savingBudget = false;
    setSBudgetControlsDisabled(false);
    showToast('token 预算保存失败，已回滚');
    syncSessionBudgetUI(true);
  });
}

// 拉取选中会话用量：live 才请求；防重入；失败静默保留旧文本
function refreshUsage() {
  var s = sessions.find(function (x) { return x.id === selectedId; });
  if (!s || !s.live) {
    usage = { sessionId: s ? s.id : null, tokens: null };
    renderDetail(); // 刷新「未挂载（需打开会话）」文本
    return;
  }
  if (usageFetching === s.id) return; // 同一会话已在拉取
  usageFetching = s.id;
  apiGet('/api/usage?sessionId=' + encodeURIComponent(s.id)).then(function (data) {
    if (usageFetching === s.id) usageFetching = null;
    if (data && data.ok === true) {
      usage = { sessionId: s.id, tokens: data.tokens };
      renderDetail();
    }
    // ok:false（未挂载等）静默保留旧文本
  }).catch(function () {
    if (usageFetching === s.id) usageFetching = null; // 网络失败静默保留旧文本
  });
}

/* ================= 清空上下文（两段确认） ================= */

// 确认态复位：3s 后回到「清空上下文」
function resetClearBtn() {
  var btn = $('btn-clear');
  btn.dataset.armed = '0';
  btn.textContent = '清空上下文';
}

$('btn-clear').addEventListener('click', function () {
  var sessionId = selectedId;
  var btn = $('btn-clear');
  if (!sessionId) return;
  if (btn.dataset.armed !== '1') {
    // 第一次点击：进入确认态，3s 后复位
    btn.dataset.armed = '1';
    btn.textContent = '再点一次确认清空';
    clearTimer = setTimeout(resetClearBtn, 3000);
    return;
  }
  // 第二次点击：真正清空
  clearTimeout(clearTimer);
  resetClearBtn();
  btn.disabled = true;
  apiPost('/api/clear', { sessionId: sessionId }).then(function (data) {
    if (data && data.ok === true) {
      if (Number(data.compacted) > 0) {
        showToast('已压缩 ' + data.compacted + ' 条（~' + data.tokens + ' tokens）', true);
      } else {
        showToast('无可压缩历史', true);
      }
    } else {
      showToast((data && data.error) || '清空失败'); // ok:false → 直接展示服务端 error 文本
    }
  }).catch(function () {
    showToast('清空失败：数据源不可达');
  }).then(function () {
    btn.disabled = false;
    return pollAll(); // 完成后刷新列表
  });
});

/* ================= 事件绑定 ================= */

// 折叠条通用绑定：点击展开/收起
function wireCollapse(headId, bodyId) {
  var head = $(headId);
  var body = $(bodyId);
  head.addEventListener('click', function () {
    var open = body.classList.toggle('hidden') === false;
    head.classList.toggle('open', open);
    head.setAttribute('aria-expanded', String(open));
  });
}
wireCollapse('btn-tools', 'body-tools');
wireCollapse('btn-defaults', 'body-defaults'); // 「默认模式」折叠区（默认折叠）

// 默认预算 slider：拖动（input）仅更新右侧文本，松开（change）才 POST
$('def-budget-range').addEventListener('input', function () {
  $('def-budget-val').textContent = budgetText(Number(this.value));
});
$('def-budget-range').addEventListener('change', function () {
  commitDefaultBudget(Number(this.value));
});

// 默认预算预设 chips（8K/20K/32K）与「不限制」按钮
var defPresets = document.querySelectorAll('#body-defaults .preset');
for (var i = 0; i < defPresets.length; i++) {
  defPresets[i].addEventListener('click', function () {
    var v = Number(this.getAttribute('data-v'));
    $('def-budget-range').value = String(v);
    commitDefaultBudget(v);
  });
}
$('btn-def-unlimit').addEventListener('click', function () {
  commitDefaultBudget(null); // 不限制 → budget 置 null
});

// 会话预算 slider：拖动（input）临时展示，松开（change）才 POST
$('s-budget-range').addEventListener('input', function () {
  dragBudget = Number(this.value);
  updateUsageText();
});
$('s-budget-range').addEventListener('change', function () {
  commitSessionBudget(Number(this.value));
});
$('s-budget-range').addEventListener('blur', function () {
  dragBudget = null; // 焦点离开（拖动取消等）时复位临时展示
  updateUsageText();
});

// 会话预算预设 chips（8K/20K/32K）与「不限制」按钮
var sPresets = document.querySelectorAll('#budget-block .preset');
for (var i = 0; i < sPresets.length; i++) {
  sPresets[i].addEventListener('click', function () {
    if (!selectedId) return;
    var v = Number(this.getAttribute('data-v'));
    $('s-budget-range').value = String(v);
    commitSessionBudget(v);
  });
}
$('btn-s-unlimit').addEventListener('click', function () {
  if (!selectedId) return;
  commitSessionBudget(null); // 不限制 → budget 置 null
});

// 「恢复全部」：白名单置回 null（全部允许）
$('btn-allow-all').addEventListener('click', function () {
  var sessionId = selectedId;
  if (!sessionId) return;
  saveSessionAllow(sessionId, null);
});

// 顶栏 ⚙ 说明弹窗：ESC 或点遮罩关闭
$('btn-help').addEventListener('click', function () { $('modal-mask').classList.remove('hidden'); });
$('btn-modal-close').addEventListener('click', function () { $('modal-mask').classList.add('hidden'); });
$('modal-mask').addEventListener('click', function (e) {
  if (e.target === $('modal-mask')) $('modal-mask').classList.add('hidden'); // 点遮罩关闭
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') $('modal-mask').classList.add('hidden'); // ESC 关闭
});

// ✕ 仅关闭窗口；helper 进程保留，可由宿主 /__ctl show 重新打开
$('btn-close').addEventListener('click', function () { window.close(); });

/* ================= 启动 ================= */

(function init() {
  // 页脚数据源来自 preload 注入的 dashInfo
  var info = window.dashInfo || {};
  $('data-source').textContent = info.hostOrigin || '-';
  $('data-source').title = info.hostOrigin || '';
  renderDefaults();               // 默认模式区初始渲染（占位数据）
  pollAll();                    // 首次加载立即拉取
  setInterval(pollAll, 5000);   // 每 5s 轮询
})();
</script>
