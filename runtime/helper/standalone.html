<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:" />
<title>会话控制台</title>
<style>
  /* ===== 基础：透明窗口 + 深色圆角卡片 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: #e8eaed;
    font-size: 13px;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 深色圆角卡片：外边距 12px，撑满剩余空间 */
  #card {
    position: absolute;
    inset: 12px;
    display: flex;
    flex-direction: column;
    background: rgba(24, 26, 30, 0.94);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }

  /* ===== 顶栏（可拖动） ===== */
  #topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 10px 0 14px;
    -webkit-app-region: drag;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
  }
  #topbar .title { font-weight: 600; font-size: 14px; flex: 1; }
  .no-drag { -webkit-app-region: no-drag; }
  .icon-btn {
    width: 26px; height: 26px; border: none; border-radius: 8px;
    background: transparent; color: #cfd4dc; font-size: 14px; cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.10); }
  /* 状态点：绿=代理可达，红=代理不可达，灰=检测中 */
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.green { background: #34c759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.8); }
  .dot.red   { background: #ff5f57; box-shadow: 0 0 6px rgba(255, 95, 87, 0.8); }
  .dot.gray  { background: #8a8f98; }

  /* ===== 顶部提示条 ===== */
  #banner {
    flex-shrink: 0;
    padding: 6px 12px;
    font-size: 12px;
    color: #ffd7d7;
    background: rgba(200, 60, 60, 0.25);
    border-bottom: 1px solid rgba(255, 95, 87, 0.35);
  }
  .hidden { display: none !important; }

  /* ===== 中间滚动区 ===== */
  #middle { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

  /* 折叠条 */
  .collapse-head {
    width: 100%;
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: none; color: #cfd4dc;
    padding: 9px 12px; font-size: 13px; cursor: pointer; text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
  }
  .collapse-head:hover { background: rgba(255, 255, 255, 0.08); }
  .collapse-head .chev { display: inline-block; transition: transform .15s; }
  .collapse-head.open .chev { transform: rotate(90deg); }
  .collapse-body {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
  }

  /* 行标签 / 滑块 / 下拉 */
  .row-label { font-size: 12px; color: #9aa0a8; margin: 10px 0 4px; }
  .row-label:first-child { margin-top: 0; }
  .slider-row { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { flex: 1; accent-color: #6e8bff; }
  .value { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: #b8bec6; }
  .value.is-default { color: #8a9099; font-size: 12px; }
  select {
    width: 100%;
    background: rgba(255, 255, 255, 0.07); color: #e8eaed;
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 8px;
    padding: 5px 8px; font-size: 13px;
  }

  /* chips */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip {
    border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 999px;
    background: transparent; color: #c8cdd5;
    padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .chip.on { background: rgba(110, 139, 255, 0.30); border-color: #6e8bff; color: #fff; }

  /* ===== 会话列表 ===== */
  #session-list { flex: 1; }
  .session-row {
    display: block; width: 100%; text-align: left;
    background: transparent; border: none;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding: 9px 12px; cursor: pointer; color: inherit;
  }
  .session-row:hover { background: rgba(255, 255, 255, 0.05); }
  .session-row.selected {
    background: rgba(110, 139, 255, 0.16);
    border-left: 3px solid #6e8bff;
  }
  .s-title { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-sub { font-size: 11px; color: #8a9099; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 18px 12px; color: #7d838c; text-align: center; }

  /* ===== 选中会话详情 ===== */
  #detail {
    flex-shrink: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding: 10px 12px;
    background: rgba(0, 0, 0, 0.18);
  }
  #detail .d-head {
    font-size: 13px; font-weight: 600; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #detail .collapse-head { padding: 7px 4px; }
  #detail .collapse-body { padding: 8px 4px; }
  .danger {
    width: 100%; margin-top: 10px; padding: 8px; border-radius: 8px; cursor: pointer;
    background: rgba(255, 82, 82, 0.16); color: #ff8585;
    border: 1px solid rgba(255, 82, 82, 0.45); font-size: 13px;
  }
  .danger:hover { background: rgba(255, 82, 82, 0.26); }
  .danger:disabled { opacity: 0.55; cursor: default; }

  /* ===== 页脚 ===== */
  #footer {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; font-size: 11px; color: #8a9099;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
  }
  #footer .grow { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== 说明弹窗 ===== */
  #modal-mask {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #modal {
    width: 84%; background: #23262c; border-radius: 14px; padding: 16px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
  }
  #modal h3 { font-size: 14px; margin-bottom: 8px; }
  #modal p { font-size: 12.5px; line-height: 1.7; color: #c8cdd5; -webkit-user-select: text; user-select: text; }
  #modal button {
    margin-top: 12px; width: 100%; padding: 7px; border-radius: 8px; border: none;
    background: #6e8bff; color: #fff; font-size: 13px; cursor: pointer;
  }

  /* ===== 错误提示条 ===== */
  #toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    background: rgba(200, 60, 60, 0.92); color: #fff; font-size: 12px;
    padding: 6px 12px; border-radius: 8px; z-index: 20; max-width: 90%;
  }
</style>
</head>
<body>
  <div id="card">
    <!-- 顶栏：拖动区域 + 状态点 + ⚙ + ✕ -->
    <header id="topbar">
      <span class="title">会话控制台</span>
      <span id="dot" class="dot gray" title="检测中"></span>
      <button id="btn-help" class="icon-btn no-drag" aria-label="说明">⚙</button>
      <button id="btn-close" class="icon-btn no-drag" aria-label="关闭窗口">✕</button>
    </header>

    <!-- 代理不可达提示条 -->
    <div id="banner" class="hidden">代理不可达，重试中</div>

    <main id="middle">
      <!-- 默认模式折叠条（默认折叠） -->
      <section>
        <button id="btn-defaults" class="collapse-head" aria-expanded="false">
          <span class="chev">▸</span> 默认模式
        </button>
        <div id="body-defaults" class="collapse-body hidden">
          <div class="row-label">预算（1024 ~ 32768，步进 1024）</div>
          <div class="slider-row">
            <input type="range" id="d-limit" min="1024" max="32768" step="1024" aria-label="默认预算" />
            <span id="d-limit-text" class="value is-default">默认</span>
          </div>
          <div class="chips" id="d-presets">
            <button type="button" class="chip" data-k="8192">8K</button>
            <button type="button" class="chip" data-k="20480">20K</button>
            <button type="button" class="chip" data-k="32768">32K</button>
          </div>
          <div class="row-label">思考</div>
          <select id="d-thinking" aria-label="思考模式">
            <option value="auto">自动</option>
            <option value="off">关</option>
            <option value="low">低</option>
            <option value="med">中</option>
            <option value="high">高</option>
          </select>
          <div class="row-label">工具白名单（全不选 = 全部允许）</div>
          <div class="chips" id="d-tools"></div>
        </div>
      </section>

      <!-- 会话列表 -->
      <section id="session-list"></section>

      <!-- 选中会话详情 -->
      <section id="detail" class="hidden">
        <div class="d-head" id="d-head-title"></div>
        <div class="row-label">预算（改即存）</div>
        <div class="slider-row">
          <input type="range" id="s-limit" min="1024" max="32768" step="1024" aria-label="会话预算" />
          <span id="s-limit-text" class="value is-default">默认</span>
        </div>
        <div class="chips" id="s-presets">
          <button type="button" class="chip" data-k="8192">8K</button>
          <button type="button" class="chip" data-k="20480">20K</button>
          <button type="button" class="chip" data-k="32768">32K</button>
        </div>
        <section>
          <button id="btn-tools" class="collapse-head" aria-expanded="false">
            <span class="chev">▸</span> 工具白名单
          </button>
          <div id="body-tools" class="collapse-body hidden">
            <div class="row-label">全不选 = 全部允许</div>
            <div class="chips" id="s-tools"></div>
          </div>
        </section>
        <button id="btn-clear" class="danger" aria-label="清空上下文">清空上下文</button>
      </section>
    </main>

    <!-- 页脚：控制面地址 + 轮询频率 + 最近更新时间 -->
    <footer id="footer">
      <span class="grow" id="admin-base" title="控制面地址">-</span>
      <span>5s 轮询</span>
      <span id="last-update">最近更新 -</span>
    </footer>
  </div>

  <!-- 说明弹窗（ESC 或点遮罩关闭） -->
  <div id="modal-mask" class="hidden" role="dialog" aria-modal="true" aria-label="使用说明">
    <div id="modal">
      <h3>说明</h3>
      <p>✕ 仅关闭窗口，进程保留，可点 DSH 内齿轮弹窗的“打开外窗”快速复现；完全关闭请在齿轮弹窗选“关闭控制台”或设置页关闭总开关。</p>
      <button id="btn-modal-close">知道了</button>
    </div>
  </div>

  <!-- 错误提示条 -->
  <div id="toast" class="hidden" role="status"></div>

<script>
'use strict';

/* ================= 常量 ================= */

// 工具白名单固定候选
var FIXED_TOOLS = ['read', 'write', 'edit', 'bash', 'glob', 'grep', 'web_search', 'web_fetch', 'todo_write'];

// 思考下拉 → 提交值：自动=null / 关={enabled:false} / 低中高={enabled:true,effort:...}
var THINKING_OPTIONS = {
  auto: null,
  off: { enabled: false },
  low: { enabled: true, effort: 'low' },
  med: { enabled: true, effort: 'med' },
  high: { enabled: true, effort: 'high' }
};

/* ================= 本地状态 ================= */

var defaults = { limit: null, allow: null, thinking: null }; // 默认模式（与代理同步）
var sessions = [];       // 会话列表（按接口返回顺序渲染）
var selectedConv = null; // 当前选中会话 conv
var polling = false;     // 轮询防重入
var clearTimer = null;   // “清空上下文”确认复位定时器
var toastTimer = null;   // 错误提示条自动隐藏定时器

function $(id) { return document.getElementById(id); }

/* ================= 基础工具 ================= */

// 时间显示：MM/DD HH:mm；无法解析时原样展示
function fmtTime(v) {
  if (!v) return '';
  var d = new Date(v);
  if (Number.isNaN(d.getTime())) return String(v);
  var p = function (n) { return String(n).padStart(2, '0'); };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

// 错误提示条（3s 自动隐藏）
function showToast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 3000);
}

/* ================= 网络请求（全部同源相对路径） ================= */

function apiGet(p) {
  return fetch(p, { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

function apiPost(p, body) {
  return fetch(p, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

/* ================= 在线状态 ================= */

// 绿=代理可达；红=代理不可达（顶部同时出现提示条）
function setOnline(ok) {
  $('dot').className = 'dot ' + (ok ? 'green' : 'red');
  $('dot').title = ok ? '代理可达' : '代理不可达';
  $('banner').classList.toggle('hidden', ok);
}

/* ================= 轮询（5s，两个接口并发） ================= */

function pollAll() {
  if (polling) return; // 上一次未结束则跳过本轮
  polling = true;
  var middle = $('middle');
  var scrollTop = middle.scrollTop; // 渲染后恢复滚动位置

  Promise.allSettled([apiGet('/api/sessions'), apiGet('/api/defaults')]).then(function (results) {
    var sr = results[0];
    var dr = results[1];
    // 任一失败 → 状态点变红 + 顶部提示条；全部成功 → 恢复绿
    setOnline(sr.status === 'fulfilled' && dr.status === 'fulfilled');

    if (sr.status === 'fulfilled') {
      var data = sr.value || {};
      sessions = Array.isArray(data) ? data : (Array.isArray(data.sessions) ? data.sessions : []);
      // 选中会话已被清除则取消选中
      if (selectedConv && !sessions.some(function (s) { return s.conv === selectedConv; })) selectedConv = null;
      renderSessions();
      renderDetail();
    }
    if (dr.status === 'fulfilled') {
      var d = dr.value || {};
      var dd = d && typeof d === 'object' && d.defaults ? d.defaults : d;
      if (dd && typeof dd === 'object') {
        if ('limit' in dd) defaults.limit = dd.limit;
        if ('allow' in dd) defaults.allow = dd.allow;
        if ('thinking' in dd) defaults.thinking = dd.thinking;
      }
      renderDefaults();
    }

    $('last-update').textContent = '最近更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
    middle.scrollTop = scrollTop;
    polling = false;
  });
}

/* ================= 默认模式渲染与保存 ================= */

// 思考值 → 下拉选项 key
function thinkingToKey(v) {
  if (v === null || v === undefined) return 'auto';
  if (v && typeof v === 'object' && v.enabled === false) return 'off';
  if (v && typeof v === 'object' && v.enabled === true) {
    return { low: 'low', med: 'med', high: 'high' }[v.effort] || 'med';
  }
  return 'auto';
}

// 工具白名单 chips：固定候选 + allow 中出现的未知工具
// allow 为 null = 全部允许（全不选）；全不选时回调 null
function renderToolsChips(container, allow, onToggle) {
  container.innerHTML = '';
  var selected = Array.isArray(allow) ? allow.slice() : [];
  var candidates = FIXED_TOOLS.slice();
  if (Array.isArray(allow)) {
    allow.forEach(function (t) {
      if (candidates.indexOf(t) === -1) candidates.push(t); // 未知工具追加展示
    });
  }
  candidates.forEach(function (t) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (selected.indexOf(t) !== -1 ? ' on' : '');
    chip.textContent = t;
    chip.setAttribute('aria-label', '切换工具 ' + t);
    chip.setAttribute('aria-pressed', selected.indexOf(t) !== -1 ? 'true' : 'false');
    chip.addEventListener('click', function () {
      var set = selected.slice();
      var i = set.indexOf(t);
      if (i === -1) set.push(t); else set.splice(i, 1);
      onToggle(set.length ? set : null); // 全不选 → null（全部允许）
    });
    container.appendChild(chip);
  });
}

// 渲染默认模式（预算滑块 / 思考下拉 / 工具 chips）
function renderDefaults() {
  var lim = defaults.limit;
  // limit 为 null 显示「默认」，滑块停在中间默认位；拖动中不被轮询打断
  if (document.activeElement !== $('d-limit')) {
    $('d-limit').value = lim == null ? 8192 : lim;
  }
  $('d-limit-text').textContent = lim == null ? '默认' : String(lim);
  $('d-limit-text').classList.toggle('is-default', lim == null);
  $('d-thinking').value = thinkingToKey(defaults.thinking);
  renderToolsChips($('d-tools'), defaults.allow, function (allow) {
    saveDefaults({ allow: allow });
  });
}

// 保存默认模式改动：body 只含改动的键；失败提示并回滚展示值
function saveDefaults(patch) {
  apiPost('/api/defaults', patch).then(function () {
    Object.assign(defaults, patch); // 成功后合并本地值
    renderDefaults();
  }).catch(function () {
    showToast('默认模式保存失败，已回滚');
    renderDefaults(); // 失败：按旧值回滚展示
  });
}

/* ================= 会话列表渲染 ================= */

function renderSessions() {
  var list = $('session-list');
  list.innerHTML = '';
  if (!sessions.length) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = '暂无会话';
    list.appendChild(empty);
    return;
  }
  sessions.forEach(function (s) {
    var row = document.createElement('button');
    row.type = 'button';
    row.className = 'session-row' + (s.conv === selectedConv ? ' selected' : '');
    row.setAttribute('aria-label', '选择会话 ' + (s.conv || ''));
    row.setAttribute('aria-pressed', s.conv === selectedConv ? 'true' : 'false');

    var title = document.createElement('div');
    title.className = 's-title';
    title.textContent = s.title || s.first_user || s.conv || '(无标题)'; // 代理已算好回退链的 title

    var sub = document.createElement('div');
    sub.className = 's-sub';
    sub.textContent = (s.conv || '') + ' · ' + fmtTime(s.last_active);

    row.appendChild(title);
    row.appendChild(sub);
    row.addEventListener('click', function () {
      selectedConv = s.conv; // 单击选中高亮
      renderSessions();
      renderDetail();
    });
    list.appendChild(row);
  });
}

/* ================= 选中会话详情 ================= */

function renderDetail() {
  var sec = $('detail');
  var s = sessions.find(function (x) { return x.conv === selectedConv; });
  if (!s) { sec.classList.add('hidden'); return; }
  sec.classList.remove('hidden');

  $('d-head-title').textContent = s.title || s.first_user || s.conv || '(无标题)';
  var lim = s.limit;
  if (document.activeElement !== $('s-limit')) {
    $('s-limit').value = lim == null ? 8192 : lim;
  }
  $('s-limit-text').textContent = lim == null ? '默认' : String(lim);
  renderToolsChips($('s-tools'), s.allow, function (allow) {
    saveSessionTools(s.conv, allow);
  });
}

// 会话预算：改即存 POST /api/context {conv,limit}
function saveSessionLimit(limit) {
  var conv = selectedConv;
  if (!conv) return;
  apiPost('/api/context', { conv: conv, limit: limit }).then(function () {
    var s = sessions.find(function (x) { return x.conv === conv; });
    if (s) s.limit = limit;
    renderDetail();
  }).catch(function () {
    showToast('预算保存失败，已回滚');
    renderDetail(); // 失败：按旧值回滚展示
  });
}

// 会话工具白名单：POST /api/tools {conv,allow:[...]|null}
function saveSessionTools(conv, allow) {
  apiPost('/api/tools', { conv: conv, allow: allow }).then(function () {
    var s = sessions.find(function (x) { return x.conv === conv; });
    if (s) s.allow = allow;
    renderDetail();
  }).catch(function () {
    showToast('工具白名单保存失败，已回滚');
    renderDetail(); // 失败：按旧值回滚展示
  });
}

/* ================= 事件绑定 ================= */

// 默认模式：滑块拖动仅更新文字，松手（change）才保存
$('d-limit').addEventListener('input', function () {
  $('d-limit-text').textContent = $('d-limit').value;
});
$('d-limit').addEventListener('change', function () {
  saveDefaults({ limit: Number($('d-limit').value) });
});
Array.prototype.forEach.call($('d-presets').querySelectorAll('button'), function (btn) {
  btn.addEventListener('click', function () { saveDefaults({ limit: Number(btn.dataset.k) }); });
});
$('d-thinking').addEventListener('change', function () {
  saveDefaults({ thinking: THINKING_OPTIONS[$('d-thinking').value] });
});

// 会话详情：预算滑块与预设
$('s-limit').addEventListener('input', function () {
  $('s-limit-text').textContent = $('s-limit').value;
});
$('s-limit').addEventListener('change', function () {
  saveSessionLimit(Number($('s-limit').value));
});
Array.prototype.forEach.call($('s-presets').querySelectorAll('button'), function (btn) {
  btn.addEventListener('click', function () { saveSessionLimit(Number(btn.dataset.k)); });
});

// 清空上下文：第一次点击进入确认态，3s 后复位；第二次点击才真正清空
function resetClearBtn() {
  var btn = $('btn-clear');
  btn.dataset.armed = '0';
  btn.textContent = '清空上下文';
}
$('btn-clear').addEventListener('click', function () {
  var conv = selectedConv;
  var btn = $('btn-clear');
  if (!conv) return;
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.textContent = '再点一次确认清空';
    clearTimer = setTimeout(resetClearBtn, 3000);
    return;
  }
  clearTimeout(clearTimer);
  resetClearBtn();
  btn.disabled = true;
  apiPost('/api/clear', { conv: conv }).then(function () {
    selectedConv = null; // 清空选中
    return pollAll();    // 刷新列表
  }).catch(function (e) {
    showToast('清空失败：' + e.message);
  }).then(function () {
    btn.disabled = false;
  });
});

// 折叠条通用绑定：点击展开/收起
function wireCollapse(headId, bodyId) {
  var head = $(headId);
  var body = $(bodyId);
  head.addEventListener('click', function () {
    var open = body.classList.toggle('hidden') === false;
    head.classList.toggle('open', open);
    head.setAttribute('aria-expanded', String(open));
  });
}
wireCollapse('btn-defaults', 'body-defaults');
wireCollapse('btn-tools', 'body-tools');

// 顶栏 ⚙ 说明弹窗：ESC 或点遮罩关闭
$('btn-help').addEventListener('click', function () { $('modal-mask').classList.remove('hidden'); });
$('btn-modal-close').addEventListener('click', function () { $('modal-mask').classList.add('hidden'); });
$('modal-mask').addEventListener('click', function (e) {
  if (e.target === $('modal-mask')) $('modal-mask').classList.add('hidden'); // 点遮罩关闭
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') $('modal-mask').classList.add('hidden'); // ESC 关闭
});

// ✕ 仅关闭窗口；helper 进程保留，可由宿主 /__ctl show 重新打开
$('btn-close').addEventListener('click', function () { window.close(); });

/* ================= 启动 ================= */

(function init() {
  // 页脚控制面地址来自 preload 注入的 dashInfo
  var info = window.dashInfo || {};
  $('admin-base').textContent = info.adminBase || '-';
  $('admin-base').title = info.adminBase || '';
  renderDefaults();
  pollAll();                    // 首次加载立即拉取
  setInterval(pollAll, 5000);   // 每 5s 轮询
})();
</script>
</body>
